
apiVersion: v1
kind: ConfigMap
metadata:
  name: apache-config
  labels:
    app: apache-app
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <title>Apache on Minikube</title>
        <style>
            body {
                font-family: sans-serif;
                text-align: center;
                margin-top: 50px;
                background-color: #f4f7f6;
            }
            h1 {
                color: #d9480f;
            }
        </style>
    </head>
    <body>
        <h1>Hello from Apache inside Minikube!</h1>
        <p>Your Kubernetes cluster is working successfully.</p>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache-deployment
  labels:
    app: apache-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apache-app
  template:
    metadata:
      labels:
        app: apache-app
    spec:
      containers:
        - name: apache
          image: httpd:2.4
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html-volume
              mountPath: /usr/local/apache2/htdocs
      volumes:
        - name: html-volume
          configMap:
            name: apache-config
---
apiVersion: v1
kind: Service
metadata:
  name: apache-service
spec:
  type: NodePort
  selector:
    app: apache-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 32000